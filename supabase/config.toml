# Cronos — local Supabase configuration.
#
# Only the settings this project actually depends on are declared. Supabase ships a
# full default file; replacing it with a minimal one keeps the surface readable, and
# any key left out falls back to the CLI's built-in default.

project_id = "cronos"

[functions.coach-assistant]
# The function verifies the caller's JWT itself before doing any work, and derives
# the user id from the verified token rather than from the request body. Leaving
# this true means the platform rejects an unauthenticated call before the function
# is even invoked, so an invalid token never reaches the handler.
verify_jwt = true